name: Build Single File Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'B*'
      - 'b*'
      - 'В*'
      - 'в*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            binary-name: GeelyUnlock.exe
          - os: macos-latest
            os-name: macOS
            binary-name: GeelyUnlock-macOS
          - os: ubuntu-latest
            os-name: Linux
            binary-name: GeelyUnlock-Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      # Build Windows: 1 single exe
      - name: Build Windows single binary
        if: runner.os == 'Windows'
        run: |
          pyinstaller --clean --onefile --name "GeelyUnlock" `
            --distpath "dist_single" `
            --add-data "core/bin/adb.exe;bin" `
            --add-data "core/bin/AdbWinApi.dll;bin" `
            --add-data "core/bin/AdbWinUsbApi.dll;bin" `
            --add-data "core/unlock-hu.sh;." `
            --add-data "core/Geely-ADB-Toggle-1.1.0.apk;." `
            core/main.py

      # Build macOS: 1 single binary
      - name: Build macOS single binary
        if: runner.os == 'macOS'
        run: |
          chmod +x core/bin/adb-darwin core/unlock-hu.sh
          pyinstaller --clean --onefile --name "GeelyUnlock-macOS" \
            --distpath "dist_single" \
            --add-data "core/bin/adb-darwin:bin" \
            --add-data "core/unlock-hu.sh:." \
            --add-data "core/Geely-ADB-Toggle-1.1.0.apk:." \
            core/main.py
          chmod +x dist_single/GeelyUnlock-macOS

      # Build Linux: 1 single binary
      - name: Build Linux single binary
        if: runner.os == 'Linux'
        run: |
          chmod +x core/bin/adb-linux core/unlock-hu.sh
          pyinstaller --clean --onefile --name "GeelyUnlock-Linux" \
            --distpath "dist_single" \
            --add-data "core/bin/adb-linux:bin" \
            --add-data "core/unlock-hu.sh:." \
            --add-data "core/Geely-ADB-Toggle-1.1.0.apk:." \
            core/main.py
          chmod +x dist_single/GeelyUnlock-Linux

      - name: Upload single binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary-name }}
          path: dist_single/${{ matrix.binary-name }}

  release:
    name: Publish 3 Single Executable Files to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all single binaries
        uses: actions/download-artifact@v4
        with:
          path: release_files/

      - name: Prepare release files
        run: |
          mkdir dist
          find release_files/ -type f \( -name "GeelyUnlock.exe" -o -name "GeelyUnlock-macOS" -o -name "GeelyUnlock-Linux" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name == 'main' && 'v2.1.4.5' || github.ref_name }}
          name: Geely ADB Unlock Master ${{ github.ref_name == 'main' && 'v2.1.4.5' || github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ### 🚀 Geely ADB Unlock Master (Zero-Dependency Native TUI/CLI)

            Универсальное автономное решение для постоянной разблокировки ADB и снятия ограничений установки сторонних приложений на автомобилях Geely (включая Geely EX5 EM-i / Flyme Auto / Ecarx).

            #### 📦 Скачать одиночный файл под вашу систему:
            * **Windows 10/11:** `GeelyUnlock.exe` (запуск двойным кликом, установка Python не требуется)
            * **macOS (Apple Silicon & Intel):** `GeelyUnlock-macOS` (`chmod +x GeelyUnlock-macOS && ./GeelyUnlock-macOS`)
            * **Linux (Ubuntu / Debian / Fedora):** `GeelyUnlock-Linux` (`chmod +x GeelyUnlock-Linux && ./GeelyUnlock-Linux`)

            #### ✨ Особенности релиза:
            * Автономный одиночный исполняемый файл без внешних зависимостей
            * Встроенные бинарники Google ADB (Windows, macOS, Linux)
            * Экспресс-снятие защиты после обновления ОД до 2.1.4.5+ и первоначальная разблокировка
            * Умная проверка и установка переключателя Geely-ADB-Toggle на экран ГУ
