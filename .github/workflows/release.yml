name: Build Single File Releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'B*'
      - 'b*'
      - 'В*'
      - 'в*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            os-name: Windows
            binary-name: GeelyUnlock.exe
          - os: macos-latest
            os-name: macOS
            binary-name: GeelyUnlock-macOS
          - os: ubuntu-latest
            os-name: Linux
            binary-name: GeelyUnlock-Linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      # Build Windows: 1 single exe
      - name: Build Windows single binary
        if: runner.os == 'Windows'
        run: |
          pyinstaller --clean --onefile --name "GeelyUnlock" `
            --distpath "dist_single" `
            --add-data "core/bin/adb.exe;bin" `
            --add-data "core/bin/AdbWinApi.dll;bin" `
            --add-data "core/bin/AdbWinUsbApi.dll;bin" `
            --add-data "core/unlock-hu.sh;." `
            --add-data "core/Geely-ADB-Toggle-1.1.0.apk;." `
            core/main.py

      # Build macOS: 1 single binary
      - name: Build macOS single binary
        if: runner.os == 'macOS'
        run: |
          chmod +x core/bin/adb-darwin core/unlock-hu.sh
          pyinstaller --clean --onefile --name "GeelyUnlock-macOS" \
            --distpath "dist_single" \
            --add-data "core/bin/adb-darwin:bin" \
            --add-data "core/unlock-hu.sh:." \
            --add-data "core/Geely-ADB-Toggle-1.1.0.apk:." \
            core/main.py
          chmod +x dist_single/GeelyUnlock-macOS

      # Build Linux: 1 single binary
      - name: Build Linux single binary
        if: runner.os == 'Linux'
        run: |
          chmod +x core/bin/adb-linux core/unlock-hu.sh
          pyinstaller --clean --onefile --name "GeelyUnlock-Linux" \
            --distpath "dist_single" \
            --add-data "core/bin/adb-linux:bin" \
            --add-data "core/unlock-hu.sh:." \
            --add-data "core/Geely-ADB-Toggle-1.1.0.apk:." \
            core/main.py
          chmod +x dist_single/GeelyUnlock-Linux

      - name: Upload single binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary-name }}
          path: dist_single/${{ matrix.binary-name }}

  release:
    name: Publish 3 Single Executable Files to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all single binaries
        uses: actions/download-artifact@v4
        with:
          path: release_files/

      - name: Prepare release files
        run: |
          mkdir dist
          find release_files/ -type f \( -name "GeelyUnlock.exe" -o -name "GeelyUnlock-macOS" -o -name "GeelyUnlock-Linux" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish or Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name == 'main' && 'universal' || github.ref_name }}
          name: Geely ADB Unlock Master v2.0 (Universal Edition)
          draft: false
          prerelease: false
          body: |
            ### 🚀 Geely ADB Unlock Master v2.0 (Universal Edition)
            Универсальное автономное решение «в один клик» для постоянной разблокировки отладки по ADB, снятия ограничений установки сторонних приложений (Parrot certificates, AutoInstallVerifier) и интеграции с веб-установщиком GeelyTune и каталогом EX5 Apps на автомобилях Geely (Geely EX5 EM-i, Galaxy E5, Belgee X80 / Flyme Auto / Ecarx).

            > 💡 **Важно:** В настройках ГУ у всех автомобилей с завода пишется маска `T1.0.0`. Данная сборка является универсальной и безопасно работает со всеми поколениями систем!

            #### 📦 Скачать готовый одиночный файл под вашу систему:
            * **Windows 10/11:** `GeelyUnlock.exe` (запуск двойным кликом, установка Python не требуется)
            * **macOS (Apple Silicon M1-M4 & Intel):** `GeelyUnlock-macOS` (`chmod +x GeelyUnlock-macOS && ./GeelyUnlock-macOS`)
            * **Linux (Ubuntu / Debian / Fedora):** `GeelyUnlock-Linux` (`chmod +x GeelyUnlock-Linux && ./GeelyUnlock-Linux`)

            ---

            #### 🌟 Что нового в версии 2.0:
            * ⚠️ **Крупные предупреждения перед перезагрузкой ГУ:** Теперь перед любым уходом экрана в ребут (при применении системных разделов или сохранении постоянного ADB) на экран выводится заметное оповещение и понятный статус в спиннере («Экран сейчас погаснет — не пугайтесь, это абсолютно нормальный штатный процесс!»). Это полностью защищает от паники и ложного ощущения поломки авто.
            * 🔄 **Защита от ложного завершения перезагрузки (`boot_id` трекер):** Добавлено отслеживание уникального идентификатора сессии ядра (`/proc/sys/kernel/random/boot_id`). Программа больше не ловит «старую единицу» `sys.boot_completed=1` в момент, когда ГУ ещё только завершает работу перед фактическим выключением.
            * 🛡️ **Интеллектуальное самовосстановление при перезагрузке:** Если связь кратковременно прерывается из-за перезагрузки автомобиля прямо во время работы скрипта, программа не вылетает в меню, а автоматически дожидается включения экрана и сама продолжает следующий проход.
            * 🚫 **Устранение ложных срабатываний переводчика ошибок:** Информационные сообщения статуса «AutoInstallVerifier: нет или уже выключен» больше никогда не трактуются анализатором как ошибка блокировки установки.
            * 💬 **Человеческий русский язык для всех кодов ошибок ADB:** Любые сбои (недостаток памяти, сон машины, отсутствие прав root, конфликт портов) сопровождаются понятной диагностической карточкой с описанием сути простыми словами и конкретными шагами решения.
            * ⚡ **Универсальность и бесшовный авто-fallback:** Для ранних прошивок (< 2.1.4.5) автоматически применяется Parrot Trust, для 2.1.4.5+ — отключение app_verify, для 2.2.0 / GMC — изоляция слоев scratch и подготовка разделов.
            * 🌐 **Бесконфликтная работа с GeelyTune и EX5 Apps (WebUSB):** При переходе на веб-сервисы служба ADB на ПК глушится, а при возврате в программу срабатывает автоматический перехват порта (`reclaim_adb_connection`).
            * 📦 **Zero-Dependency:** Внутри каждого исполняемого файла зашиты официальные бинарники Google ADB, скрипты адаптации и APK переключателя.
